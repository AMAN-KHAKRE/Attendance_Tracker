<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Team Attendance{% endblock %}</title>
  <style>
    :root { color-scheme: light; font: 16px/1.5 system-ui, sans-serif; color: #172033; background: #f3f5f9; }
    body { margin: 0; }
    header { background: #173b67; color: white; padding: 1rem max(calc((100% - 760px) / 2), 1rem); display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
    header a { color: white; }
    main { box-sizing: border-box; max-width: 760px; margin: 2rem auto; padding: 0 1rem; }
    .card { background: white; border: 1px solid #dce2eb; border-radius: 12px; padding: 1.5rem; margin-bottom: 1rem; }
    .notice { border-radius: 8px; padding: .75rem 1rem; margin: 1rem 0; background: #e8eef8; }
    .notice.error { background: #fff0ef; color: #8a2119; }
    .notice.success { background: #e8f6ed; color: #175b31; }
    button { border: 0; border-radius: 7px; padding: .75rem 1rem; background: #1769aa; color: white; font: inherit; cursor: pointer; }
    button:disabled { opacity: .6; cursor: wait; }
    input { box-sizing: border-box; width: 100%; max-width: 28rem; padding: .65rem; margin: .25rem 0 1rem; font: inherit; }
    label { display: block; }
    table { border-collapse: collapse; width: 100%; }
    th, td { text-align: left; padding: .6rem; border-bottom: 1px solid #dce2eb; }
    .muted { color: #536176; }
    .inline { display: inline; }
    .inline button { padding: .4rem .65rem; }
    @media (max-width: 500px) { header { padding: .8rem 1rem; } main { margin-top: 1rem; } .card { padding: 1rem; } }
  </style>
</head>
<body>
  <header>
    <strong>Team Attendance</strong>
  </header>
  <main>
    {% for category, message in get_flashed_messages(with_categories=true) %}
      <div class="notice {{ category }}" role="status">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
