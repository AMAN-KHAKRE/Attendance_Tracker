name: Daily attendance report

on:
  schedule:
    - cron: "35 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: daily-attendance-report
  cancel-in-progress: false

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out report sender
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch report and send email
        env:
          ATTENDANCE_REPORT_URL: ${{ secrets.ATTENDANCE_REPORT_URL }}
          ATTENDANCE_REPORT_KEY: ${{ secrets.ATTENDANCE_REPORT_KEY }}
          REPORT_TO: ${{ secrets.REPORT_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python scripts/send_report.py
